[workspace]
resolver = "3"
members = ["crates/gui", "crates/svr", "crates/update-signer"]
default-members = ["crates/gui", "crates/svr"]

# ---- Debug 下让框架依赖带优化，避免 UI 卡顿（gpui-kit 官方建议）----
[profile.dev.package]
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# ---- 统一 release 配置 ----
# workspace 成员的 [profile.*] 会被 Cargo 忽略，所有 profile 必须放在这里。
[profile.release]
opt-level = "s"
strip = true
# fat LTO：跨 crate 内联 + 更强的死代码消除
lto = "fat"
# 不展开栈：去掉 landing pad / 展开表，GUI 不需要 catch_unwind 兜底
panic = "abort"
codegen-units = 1

# ---- 冷路径依赖用 -Oz 编译以压缩体积（-Os 仍用于网络/协议栈热路径）----
# 说明：全局已是 opt-level="s"，下面列出的热路径条目保留 "s"；
# 渲染 / 字体 / 图片 / 正则 / YAML 等只在启动或低频路径使用，降到 "z"。

[profile.release.package.aho_corasick]
opt-level = "z"

[profile.release.package.exr]
opt-level = "z"

[profile.release.package.flate2]
opt-level = "z"

[profile.release.package.h2]
opt-level = "z"

[profile.release.package.hashbrown]
opt-level = "s"

[profile.release.package.image]
opt-level = "z"

[profile.release.package.image-webp]
opt-level = "z"

[profile.release.package.markdown]
opt-level = "z"

[profile.release.package.miniz_oxide]
opt-level = "z"

[profile.release.package.regex]
opt-level = "z"

[profile.release.package.regex-automata]
opt-level = "z"

[profile.release.package.regex-syntax]
opt-level = "z"

[profile.release.package.resvg]
opt-level = "z"

# Ed25519 验签：保持 -Os（密码学热路径）。
[profile.release.package.ring]
opt-level = "s"

[profile.release.package.serde_yaml]
opt-level = "z"

# TUN 数据面热路径：保持 -Os。
[profile.release.package.smoltcp]
opt-level = "s"

[profile.release.package.tiny-skia]
opt-level = "z"

[profile.release.package.trust-dns-proto]
opt-level = "s"

[profile.release.package.trust-dns-resolver]
opt-level = "s"

[profile.release.package.unsafe-libyaml]
opt-level = "z"

[profile.release.package.usvg]
opt-level = "z"

[profile.release.package.zune-core]
opt-level = "z"

[profile.release.package.zune-jpeg]
opt-level = "z"

# ---- 字体/图标/资源解析：仅在渲染期使用，按体积优先 ----
[profile.release.package.rustybuzz]
opt-level = "z"

[profile.release.package.ttf-parser]
opt-level = "z"

[profile.release.package.gpui-kit-assets]
opt-level = "z"

[profile.release.package.png]
opt-level = "z"
