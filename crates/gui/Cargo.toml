[package]
name = "ssl-proxy-gui"
version = "2.7.2"
edition = "2024"
description = "SSL Proxy Client (GPUI)"
license = "MIT"

[dependencies]
gpui-kit = "0.9.1"
smol = "2"

# ---- 代理核心（与 Tauri 版保持一致）----
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "fs",
] }
tokio-native-tls = "0.3"
native-tls = { version = "0.2", features = ["alpn"] }
trust-dns-resolver = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
regex = "1"
rand = "0.8"
crc32fast = "1"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
futures-util = "0.3"
thiserror = "2"
rust-embed = "8"
hmac = "0.12"
sha2 = "0.10"
ring = "0.17"

# ---- TUN 数据面（阶段 B）----
# 用户态协议栈：TCP/UDP 终结与 NAT；medium-ip 直接收发 IP 包。
smoltcp = { version = "0.11", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
# DNS 报文解析/构造（fake-ip 应答）；与 trust-dns-resolver 0.23 同族。
trust-dns-proto = "0.23"
# 直连出站绑定物理网卡（bind_device_by_index → IP_UNICAST_IF），防 TUN 自环。
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    # 停用 TUN 时用 SetupAPI 从系统卸载虚拟网卡设备。
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
] }
# WinTun 用户态网卡驱动绑定；运行时需 wintun.dll 位于 exe 同目录。
wintun = "0.4"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
# 把 icon.ico 与版本信息编进 exe（build.rs）
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
# macOS 单实例文件锁（flock）
libc = "0.2"
