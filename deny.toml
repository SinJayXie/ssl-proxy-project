# cargo-deny configuration: permissive-license allow-list plus advisory checks.
# Run locally: cargo deny check licenses bans advisories sources

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Accept a license when one of the alternatives is on the allow-list, so
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later" style expressions pass.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "NCSA",
    "Unicode-3.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
